version: "3.8"

services:
  # IoT-ZTNA 网关（后端 + 内置前端控制台）
  ztna-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-ztna-gateway
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - RUST_LOG=info
      - ZTNA_STATIC_DIR=/app/console/dist
      - ZTNA_ADMIN_USER=${ZTNA_ADMIN_USER:-admin}
      - ZTNA_ADMIN_PASS=${ZTNA_ADMIN_PASS:-admin123}
      - ZTNA_JWT_SECRET=${ZTNA_JWT_SECRET:-iot-ztna-dev-secret-change-in-production}
      - ZTNA_AUTH_ENABLED=${ZTNA_AUTH_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9443/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ztna-net

  # Prometheus 监控（可选）
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: iot-ztna-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ztna-net
    profiles:
      - monitoring

  # Grafana 仪表盘（可选）
  grafana:
    image: grafana/grafana:11.0.0
    container_name: iot-ztna-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ztna-net
    profiles:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  ztna-net:
    driver: bridge
